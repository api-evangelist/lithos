name: Lithos
description: 'Lithos Carbon is a deep-tech carbon-removal company that spreads crushed
  basalt on croplands to accelerate enhanced rock weathering, converting atmospheric
  CO2 into dissolved bicarbonate that is permanently stored as ocean carbonates. The
  company pairs soil models and machine learning with agronomic partnerships to maximize
  durable carbon dioxide removal while improving soil health and crop productivity for
  farmers, and sells the resulting high-permanence carbon credits to corporate buyers.
  Surfaced as a Greylock portfolio company and added to the API Evangelist network;
  an enrichment pass confirmed the company publishes no public API, SDK, or developer
  surface as of this profile.'
